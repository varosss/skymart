syntax = "proto3";

package billing.v1;

option go_package = "clirzy/billing/proto;proto";

// ---------- COMMON ----------

message Invoice {
  string id = 1;
  int64 amount = 2;
  string currency = 3;
  string status = 4;
}

// ----------- QUERY -----------

message GetInvoiceByIdRequest {
  string id = 1;
}

// ---------- SERVICE ----------

service BillingService {
  rpc GetInvoiceById(GetInvoiceByIdRequest) returns (Invoice);
}
