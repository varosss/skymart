# ---------------------------------------
# Nginx default.conf для всех сервисов Go
# ---------------------------------------
server {
    listen 80;
    server_name localhost;

    # ===============================
    # API Gateway
    # ===============================
    location /api/ {
        proxy_pass http://clirzy-api-gateway:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===============================
    # AI Service
    # ===============================
    location /ai/ {
        proxy_pass http://clirzy-ai-service:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===============================
    # Auth Service
    # ===============================
    location /auth/ {
        proxy_pass http://clirzy-auth-service:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===============================
    # Payments Service
    # ===============================
    location /payments/ {
        proxy_pass http://clirzy-payments-service:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===============================
    # Общие настройки
    # ===============================
    client_max_body_size 50M;
    keepalive_timeout 65;
}
