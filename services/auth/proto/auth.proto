syntax = "proto3";

package auth.v1;

option go_package = "clirzy/auth/proto;proto";

// ---------- MODELS ----------

message User {
  int64 id = 1;
  string email = 2;
  string username = 3;
}

// ---------- REGISTER ----------

message RegisterRequest {
  string email = 1;
  string password = 2;
  string username = 3;
}

message RegisterResponse {
  User user = 1;
}

// ---------- LOGIN ----------

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2; // опционально, можно убрать
  User user = 3;
}

// ---------- AUTH TOKEN VALIDATION ----------

message AuthRequest {
  string token = 1;
}

message AuthResponse {
  bool valid = 1;
  User user = 2;
}

// ---------- SERVICE ----------

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Auth(AuthRequest) returns (AuthResponse);
}
