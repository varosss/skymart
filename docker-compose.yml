services:
  clirzy-auth:
    container_name: clirzy-auth
    image: vaross/private-projects:clirzy-auth-latest
    env_file:
      - .env
    depends_on:
      - clirzy-postgres
    networks:
      - clirzy-network

  clirzy-user:
    container_name: clirzy-user
    image: vaross/private-projects:clirzy-user-latest
    env_file:
      - .env
    depends_on:
      - clirzy-postgres
    networks:
      - clirzy-network

  clirzy-payments:
    container_name: clirzy-payments
    image: vaross/private-projects:clirzy-payments-latest
    env_file:
      - .env
    depends_on:
      - clirzy-postgres
    networks:
      - clirzy-network

  clirzy-zookeeper:
  image: confluentinc/cp-zookeeper:7.6.0
  container_name: clirzy-zookeeper
  environment:
    - .env
  ports:
    - "2181:2181"

  clirzy-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: clirzy-kafka
    depends_on:
      - clirzy-zookeeper
    ports:
      - "9092:9092"
    environment:
      - .env

  clirzy-nginx:
    container_name: clirzy-nginx
    image: nginx:1.27-alpine
    platform: linux/amd64
    restart: always
    ports:
      - 81:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - clirzy-network

  clirzy-postgres:
    container_name: clirzy-postgres
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - clirzy-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - clirzy-network

  clirzy-redis:
    image: redis:7.2
    container_name: clirzy-redis
    ports:
      - "6379:6379"
    volumes:
      - clirzy-redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    networks:
      - clirzy-network

volumes:
  clirzy-postgres-data:
    driver: local
  clirzy-redis-data:
    driver: local

networks:
  clirzy-network:
    name: clirzy-network
    driver: bridge
